[variables]
BASE_PATH = "/"
PORT = "3000"
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_20"]
cmds = ["corepack enable"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/dey-marketing run build"]

[start]
cmd = "npx serve artifacts/dey-marketing/dist/public -s -l $PORT"

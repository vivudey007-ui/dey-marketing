[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @workspace/dey-marketing run build"

[deploy]
startCommand = "npx serve artifacts/dey-marketing/dist/public -s -l $PORT"

[[deploy.environmentVariables]]
name = "BASE_PATH"
value = "/"

[[deploy.environmentVariables]]
name = "RAILPACK_INSTALL_CMD"
value = "corepack enable && pnpm install --no-frozen-lockfile"

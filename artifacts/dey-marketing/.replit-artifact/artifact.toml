kind = "web"
previewPath = "/"
title = "DEY Marketing"
version = "1.0.0"
id = "artifacts/dey-marketing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19146

[services.development]
run = "pnpm --filter @workspace/dey-marketing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dey-marketing", "run", "build" ]
publicDir = "artifacts/dey-marketing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19146"
BASE_PATH = "/"
